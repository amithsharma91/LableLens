[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
pythonpath = ["."]

[project]
name = "labellens-backend"
version = "0.1.0"
description = "LabelLens FastAPI Backend"
authors = [{name = "LabelLens Team"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "greenlet",
    "httpx",
    # Supabase asymmetric JWT verification (JWKS signature validation).
    "pyjwt[crypto]"
]

[project.optional-dependencies]
# Test-only dependencies. Local development installs `.[test]`;
# production images install the base set only.
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
# The backend is a PEP 420 namespace layout (no __init__.py);
# declare the app package explicitly so `pip install .` builds.
include = ["app*"]
